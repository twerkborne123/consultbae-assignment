<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ConsultBae Audio Submission</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<div class="container">

    <h1>ConsultBae Audio Submission</h1>

    <p class="subtitle">
        Submit an audio recording for an existing candidate.
    </p>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form
        action="{{ url_for('submit_audio') }}"
        method="POST"
        enctype="multipart/form-data"
    >

        <label for="name">Name</label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter candidate name"
            required
        >


        <label for="phone">Phone</label>

        <input
            type="text"
            id="phone"
            name="phone"
            placeholder="Enter phone number"
            required
        >


        <label for="audio">Audio file</label>

        <input
            type="file"
            id="audio"
            name="audio"
            accept="audio/*"
            required
        >


        <button type="submit">
            Submit Audio
        </button>

    </form>

    <a class="link" href="{{ url_for('submissions') }}">
        View submissions →
    </a>

</div>

</body>
</html>
